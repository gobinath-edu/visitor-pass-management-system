services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - visitor-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/visitor-pass-management
      JWT_SECRET: ${JWT_SECRET:-change-this-docker-secret}
      CLIENT_URL: http://localhost:5173
      NODE_ENV: production
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: lax
    depends_on:
      mongodb:
        condition: service_healthy

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: http://localhost:5000/api
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  visitor-mongo: